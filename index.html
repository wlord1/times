<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Times Table Practice</title>
    <style>
        :root {
            /* Pro Dark Mode Theme */
            --primary: #818cf8;
            --primary-hover: #6366f1;
            --secondary: #34d399;
            --secondary-hover: #10b981;
            --warning: #fbbf24;
            --danger: #f87171;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --card-bg-alt: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --gray: #475569;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            max-width: 650px;
            width: 100%;
            text-align: center;
        }

        h1 { 
            margin-top: 0; 
            color: var(--text); 
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* Menu Styles */
        .settings-row {
            display: flex;
            gap: 20px;
            margin: 1.5rem 0;
            text-align: left;
        }

        .settings-group {
            flex: 1;
            background: var(--card-bg-alt);
            padding: 15px;
            border-radius: 12px;
        }

        .settings-group label.title {
            display: block;
            font-weight: 600;
            margin-bottom: 0.8rem;
            color: var(--text);
            letter-spacing: 0.5px;
            font-size: 0.95rem;
            text-transform: uppercase;
        }

        .number-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .checkbox-btn input { display: none; }
        .checkbox-btn span {
            display: block; padding: 10px;
            border: 2px solid var(--gray); border-radius: 8px;
            text-align: center; font-size: 1.2rem; font-weight: bold;
            cursor: pointer; transition: all 0.2s; background: var(--card-bg);
            color: var(--text);
        }
        .checkbox-btn input:checked + span {
            background-color: var(--primary); border-color: var(--primary); color: #ffffff;
        }

        .radio-option {
            display: block; margin-bottom: 8px; font-size: 1.1rem; cursor: pointer; color: var(--text);
        }
        .radio-option input { margin-right: 8px; transform: scale(1.2); accent-color: var(--primary); }

        .controls { display: flex; gap: 20px; margin-bottom: 1.5rem; text-align: left; }
        .control-item { flex: 1; }
        .control-item label { font-weight: 600; display: block; margin-bottom: 5px; color: var(--text-muted); font-size: 0.95rem;}
        
        /* Remove arrows from number inputs globally */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
            width: 100%; padding: 10px; font-size: 1.1rem;
            border: 2px solid var(--gray); border-radius: 8px; outline: none;
            background: var(--card-bg-alt); color: var(--text);
        }
        input[type="number"]:focus { border-color: var(--primary); }

        button {
            width: 100%; padding: 15px; font-size: 1.1rem; font-weight: bold;
            color: #ffffff; background-color: var(--primary); border: none;
            border-radius: 8px; cursor: pointer; margin-bottom: 10px; transition: 0.2s;
        }
        button:hover { background-color: var(--primary-hover); }
        button.alt-btn { background-color: var(--card-bg-alt); color: var(--text); border: 1px solid var(--gray); }
        button.alt-btn:hover { background-color: var(--gray); }
        button.cancel-btn { background-color: var(--danger); margin-top: 2rem; width: auto; padding: 10px 20px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Practice Area Styles */
        #practice-area, #complete-area { display: none; }
        
        .progress { 
            font-size: 1.2rem; 
            color: var(--text-muted); 
            font-weight: 600; 
            margin-bottom: 1rem;
            letter-spacing: 0.5px;
        }
        
        /* Fixed Width Equation Slots to Prevent Jumping */
        .equation-display {
            font-size: 4.5rem; font-weight: bold; margin: 2rem 0;
            min-height: 120px; 
            display: flex; justify-content: center; align-items: center; 
            color: var(--text);
        }
        
        .eq-slot {
            width: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .eq-op {
            width: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
        }

        /* Passive Container styles */
        .passive-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100px;
        }

        .answer-passive {
            color: var(--secondary); opacity: 0; transition: opacity 0.2s;
            position: absolute;
        }
        .answer-passive.visible { opacity: 1; }
        
        .missing-box {
            color: var(--text-muted); border-bottom: 4px solid var(--text-muted); padding: 0 10px;
            position: absolute;
        }

        /* Typed Input styles */
        input.answer-input {
            width: 150px; height: 100px; font-size: 4rem; font-weight: bold;
            text-align: center; color: var(--primary); background: transparent;
            border: 4px solid var(--primary); border-radius: 12px; outline: none;
        }
        input.answer-input:focus { border-color: var(--primary-hover); box-shadow: 0 0 15px rgba(129, 140, 248, 0.2); }
        input.answer-input.error {
            border-color: var(--danger); color: var(--danger); animation: shake 0.4s;
        }
        input.answer-input.success { border-color: var(--secondary); color: var(--secondary); }

        /* Stats Grid Styles */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 2rem;
            margin-top: 1rem;
        }
        
        .stat-card {
            background: var(--card-bg-alt);
            padding: 20px 10px;
            border-radius: 12px;
            border: 1px solid var(--gray);
            text-align: center;
        }

        .stat-card .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .stat-card .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        /* Review List Styles */
        .review-container {
            background: var(--card-bg-alt);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 2rem;
            text-align: left;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid var(--gray);
        }
        
        .review-container h3 {
            margin-top: 0;
            color: var(--warning);
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .review-list {
            margin: 0;
            padding-left: 25px;
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--text);
        }

        .review-list li {
            margin-bottom: 8px;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }

        @media (max-width: 550px) {
            .stats-grid { grid-template-columns: 1fr; }
            .equation-display { font-size: 3.5rem; }
            input.answer-input { font-size: 3rem; width: 100px; height: 80px; }
            .eq-slot { width: 100px; }
            .eq-op { width: 30px; }
        }
    </style>
</head>
<body>

    <!-- MAIN MENU -->
    <div class="container" id="menu-area">
        <h1>Times Table Practice</h1>
        
        <div class="settings-group" style="background: transparent; padding: 0; border: none;">
            <label class="title" style="color: var(--text-muted);">Select Tables (2-9):</label>
            <div class="number-grid">
                <label class="checkbox-btn"><input type="checkbox" value="2" class="table-cb"><span>2</span></label>
                <label class="checkbox-btn"><input type="checkbox" value="3" class="table-cb"><span>3</span></label>
                <label class="checkbox-btn"><input type="checkbox" value="4" class="table-cb"><span>4</span></label>
                <label class="checkbox-btn"><input type="checkbox" value="5" class="table-cb"><span>5</span></label>
                <label class="checkbox-btn"><input type="checkbox" value="6" class="table-cb"><span>6</span></label>
                <label class="checkbox-btn"><input type="checkbox" value="7" class="table-cb"><span>7</span></label>
                <label class="checkbox-btn"><input type="checkbox" value="8" class="table-cb"><span>8</span></label>
                <label class="checkbox-btn"><input type="checkbox" value="9" class="table-cb"><span>9</span></label>
            </div>
        </div>

        <div class="settings-row">
            <div class="settings-group">
                <label class="title">Order</label>
                <label class="radio-option"><input type="radio" name="order" value="random" checked> Random</label>
                <label class="radio-option"><input type="radio" name="order" value="inorder"> In-Order</label>
            </div>
            
            <div class="settings-group">
                <label class="title">Interaction Mode</label>
                <label class="radio-option"><input type="radio" name="interaction" value="typed" onchange="toggleInteraction()" checked> Type the Answer</label>
                <label class="radio-option"><input type="radio" name="interaction" value="passive" onchange="toggleInteraction()"> Watch & Wait</label>
            </div>
        </div>

        <div class="settings-row">
            <div class="settings-group" style="flex: 100%;">
                <label class="radio-option" style="font-weight: 600; margin: 0;">
                    <input type="checkbox" id="missing-var"> Enable Missing Variables (e.g. 6 &times; ? = 42)
                </label>
            </div>
        </div>

        <div class="controls">
            <div class="control-item">
                <label for="duration" id="duration-label">Timer (Secs, 0 = Infinite):</label>
                <input type="number" id="duration" min="0" max="15" value="0">
            </div>
            <div class="control-item">
                <label for="cycles">Number of Cycles:</label>
                <input type="number" id="cycles" min="1" value="1">
            </div>
        </div>

        <button onclick="startPractice(false)">Start Selected Tables</button>
        <button class="alt-btn" onclick="startPractice(true)">Start "Minimum 36" Mode</button>
    </div>

    <!-- PRACTICE AREA -->
    <div class="container" id="practice-area">
        <div class="progress" id="progress-text">Problem 1 of 36</div>
        
        <div class="equation-display" id="equation-display">
            <!-- Dynamically injected based on settings -->
        </div>

        <button class="cancel-btn" onclick="returnToMenu()">Stop & Return</button>
    </div>

    <!-- COMPLETE AREA -->
    <div class="container" id="complete-area">
        <h1>Practice Complete!</h1>
        <p id="completion-subtitle" style="font-size: 1.1rem; color: var(--text-muted); margin-bottom: 0;">Session Report</p>

        <div id="stats-container">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="stat-time">0m 0s</div>
                    <div class="stat-label">Total Time</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-accuracy">100%</div>
                    <div class="stat-label">Accuracy</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-avg-speed">-</div>
                    <div class="stat-label">Avg Speed</div>
                </div>
            </div>
            
            <div id="review-section" class="review-container" style="display: none;">
                <h3>Needs More Work:</h3>
                <ul class="review-list" id="review-list-items">
                    <!-- Flagged items injected here -->
                </ul>
            </div>
        </div>

        <button onclick="returnToMenu()" style="margin-top: 1rem;">Return to Menu</button>
    </div>

    <script>
        let practiceList = [];
        let reviewQueue = [];
        let currentIndex = 0;
        let timerId = null;
        let timerId2 = null;
        let totalCycles = 1;
        let setSize = 0;
        let durationMs = 0;
        let currentExpectedAnswer = 0;

        // Settings variables
        let isRandom = true;
        let isTyped = true;
        let useMissingVar = false;

        // Analytics tracking variables
        let sessionStartTime = 0;
        let questionStartTime = 0;
        let totalTypedTimeMs = 0;
        let typedQuestionCount = 0;
        let totalErrors = 0;

        function toggleInteraction() {
            const isPassive = document.querySelector('input[name="interaction"]:checked').value === 'passive';
            const durationInput = document.getElementById('duration');
            const durationLabel = document.getElementById('duration-label');
            
            if (isPassive) {
                durationLabel.innerText = "Wait Duration (Secs):";
                durationInput.min = 1;
                if (parseInt(durationInput.value) === 0) {
                    durationInput.value = 3;
                }
            } else {
                durationLabel.innerText = "Timer (Secs, 0 = Infinite):";
                durationInput.min = 0;
            }
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function startPractice(isMinimumMode) {
            let baseSet = [];
            reviewQueue = [];

            // Reset Analytics
            sessionStartTime = Date.now();
            totalTypedTimeMs = 0;
            typedQuestionCount = 0;
            totalErrors = 0;

            // Get user settings
            isRandom = document.querySelector('input[name="order"]:checked').value === 'random';
            isTyped = document.querySelector('input[name="interaction"]:checked').value === 'typed';
            useMissingVar = document.getElementById('missing-var').checked;
            
            totalCycles = parseInt(document.getElementById('cycles').value) || 1;
            let seconds = parseInt(document.getElementById('duration').value) || 0;
            
            // Constrain limits
            if (isTyped && seconds < 0) seconds = 0;
            if (!isTyped && seconds < 1) seconds = 3; 
            if (seconds > 60) seconds = 60;
            if (totalCycles < 1) totalCycles = 1;
            
            durationMs = seconds * 1000;

            if (isMinimumMode) {
                for (let i = 2; i <= 9; i++) {
                    for (let j = i; j <= 9; j++) {
                        if (isRandom && Math.random() > 0.5 && i !== j) {
                            baseSet.push({ a: j, b: i, ans: i * j });
                        } else {
                            baseSet.push({ a: i, b: j, ans: i * j });
                        }
                    }
                }
            } else {
                const checkboxes = document.querySelectorAll('.table-cb:checked');
                const selectedTables = Array.from(checkboxes).map(cb => parseInt(cb.value));

                if (selectedTables.length === 0) {
                    alert("Please select at least one number from the grid.");
                    return;
                }

                selectedTables.forEach(t => {
                    for (let i = 2; i <= 9; i++) {
                        baseSet.push({ a: t, b: i, ans: t * i });
                    }
                });
            }

            setSize = baseSet.length;
            practiceList = [];

            for (let c = 0; c < totalCycles; c++) {
                let cycleSet = [...baseSet];
                if (isRandom) shuffleArray(cycleSet);
                practiceList = practiceList.concat(cycleSet);
            }

            currentIndex = 0;
            
            document.getElementById('menu-area').style.display = 'none';
            document.getElementById('complete-area').style.display = 'none';
            document.getElementById('practice-area').style.display = 'block';
            
            runNextQuestion();
        }

        function runNextQuestion() {
            clearTimeout(timerId);
            clearTimeout(timerId2);

            const totalQuestionsInSession = setSize * totalCycles;
            document.getElementById('progress-text').innerText = `Problem ${currentIndex + 1} of ${totalQuestionsInSession}`;

            // Check if we reached the end of the list
            if (currentIndex >= practiceList.length) {
                finishPractice();
                return;
            }

            const currentProblem = practiceList[currentIndex];
            currentProblem.flagged = false;

            // Start timer for average speed tracking
            questionStartTime = Date.now();

            // Determine display format 
            // 0 = Standard, 1 = Missing A, 2 = Missing B
            let problemFormat = 0;
            if (useMissingVar) {
                // If Missing Var is ON, only pick 1 or 2 (Never 0)
                problemFormat = Math.floor(Math.random() * 2) + 1;
            }

            const display = document.getElementById('equation-display');
            let slot1 = "", slot2 = "", slot3 = "";

            if (isTyped) {
                // Typed Input Mode
                let inputHtml = `<input type="number" class="answer-input" id="user-input" autocomplete="off">`;
                
                if (problemFormat === 1) {
                    slot1 = inputHtml;
                    slot2 = currentProblem.b;
                    slot3 = currentProblem.ans;
                    currentExpectedAnswer = currentProblem.a;
                } else if (problemFormat === 2) {
                    slot1 = currentProblem.a;
                    slot2 = inputHtml;
                    slot3 = currentProblem.ans;
                    currentExpectedAnswer = currentProblem.b;
                } else {
                    slot1 = currentProblem.a;
                    slot2 = currentProblem.b;
                    slot3 = inputHtml;
                    currentExpectedAnswer = currentProblem.ans;
                }
                
                display.innerHTML = `
                    <div class="eq-slot">${slot1}</div>
                    <div class="eq-op">&times;</div>
                    <div class="eq-slot">${slot2}</div>
                    <div class="eq-op">=</div>
                    <div class="eq-slot">${slot3}</div>
                `;

                const inputEl = document.getElementById('user-input');
                inputEl.focus();
                
                inputEl.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        checkTypedAnswer();
                    }
                });

                // Set Timer if Duration is greater than 0
                if (durationMs > 0) {
                    timerId = setTimeout(() => {
                        if (inputEl && !inputEl.disabled) {
                            const userVal = parseInt(inputEl.value);
                            
                            // Check if the current value matches what we expected
                            if (userVal === currentExpectedAnswer) {
                                // Auto-enter correct answer
                                checkTypedAnswer();
                            } else {
                                // Time ran out and it is empty or wrong
                                inputEl.disabled = true;
                                inputEl.classList.add('error');
                                inputEl.value = currentExpectedAnswer; // Show correct answer
                                flagCurrentProblem();
                                
                                setTimeout(() => {
                                    currentIndex++;
                                    runNextQuestion();
                                }, 1500); 
                            }
                        }
                    }, durationMs);
                }

            } else {
                // Passive Mode (Watch & Wait)
                if (problemFormat === 1) {
                    slot1 = `<div class="passive-container"><span class="answer-passive" id="ans-text">${currentProblem.a}</span><span class="missing-box" id="q-box">?</span></div>`;
                    slot2 = currentProblem.b;
                    slot3 = currentProblem.ans;
                } else if (problemFormat === 2) {
                    slot1 = currentProblem.a;
                    slot2 = `<div class="passive-container"><span class="answer-passive" id="ans-text">${currentProblem.b}</span><span class="missing-box" id="q-box">?</span></div>`;
                    slot3 = currentProblem.ans;
                } else {
                    slot1 = currentProblem.a;
                    slot2 = currentProblem.b;
                    slot3 = `<div class="passive-container"><span class="answer-passive" id="ans-text">${currentProblem.ans}</span></div>`;
                }
                
                display.innerHTML = `
                    <div class="eq-slot">${slot1}</div>
                    <div class="eq-op">&times;</div>
                    <div class="eq-slot">${slot2}</div>
                    <div class="eq-op">=</div>
                    <div class="eq-slot">${slot3}</div>
                `;
                
                timerId = setTimeout(() => {
                    document.getElementById('ans-text').classList.add('visible');
                    const qBox = document.getElementById('q-box');
                    if(qBox) qBox.style.display = 'none';
                    
                    timerId2 = setTimeout(() => {
                        currentIndex++;
                        runNextQuestion();
                    }, 2000); 
                }, durationMs);
            }
        }

        function checkTypedAnswer() {
            clearTimeout(timerId); // Stop the timeout since they entered an answer
            
            const inputEl = document.getElementById('user-input');
            const userVal = parseInt(inputEl.value);

            if (userVal === currentExpectedAnswer) {
                // Record speed data
                const timeTaken = Date.now() - questionStartTime;
                totalTypedTimeMs += timeTaken;
                typedQuestionCount++;

                inputEl.classList.remove('error');
                inputEl.classList.add('success');
                inputEl.disabled = true; 
                
                setTimeout(() => {
                    currentIndex++;
                    runNextQuestion();
                }, 400); 
            } else {
                inputEl.classList.add('error');
                flagCurrentProblem(); // Log it as wrong behind the scenes
                
                setTimeout(() => {
                    inputEl.classList.remove('error');
                    inputEl.value = '';
                    inputEl.focus();
                    
                    // Resume the timer if one existed
                    if (durationMs > 0) {
                        const remainingTime = durationMs - (Date.now() - questionStartTime);
                        if (remainingTime > 0) {
                            timerId = setTimeout(() => {
                                if (inputEl && !inputEl.disabled) {
                                    // Timer expired on the retry attempt
                                    const retryVal = parseInt(inputEl.value);
                                    if (retryVal === currentExpectedAnswer) {
                                        checkTypedAnswer();
                                    } else {
                                        inputEl.disabled = true;
                                        inputEl.classList.add('error');
                                        inputEl.value = currentExpectedAnswer;
                                        setTimeout(() => {
                                            currentIndex++;
                                            runNextQuestion();
                                        }, 1500);
                                    }
                                }
                            }, remainingTime);
                        } else {
                            // If they spent too long guessing and time is up, force next
                            inputEl.disabled = true;
                            inputEl.value = currentExpectedAnswer;
                            setTimeout(() => {
                                currentIndex++;
                                runNextQuestion();
                            }, 1500);
                        }
                    }
                }, 500);
            }
        }

        function flagCurrentProblem() {
            const currentProblem = practiceList[currentIndex];
            if (!currentProblem.flagged) {
                currentProblem.flagged = true;
                totalErrors++; // Increment errors for accuracy calc
                
                const problemString = `${currentProblem.a} &times; ${currentProblem.b} = ${currentProblem.ans}`;
                if (!reviewQueue.includes(problemString)) {
                    reviewQueue.push(problemString); 
                }
            }
        }

        function finishPractice() {
            clearTimeout(timerId);
            clearTimeout(timerId2);
            
            const statsContainer = document.getElementById('stats-container');
            const completionSubtitle = document.getElementById('completion-subtitle');

            if (!isTyped) {
                // Hide stats completely for Watch & Wait mode
                statsContainer.style.display = 'none';
                completionSubtitle.style.display = 'none';
            } else {
                // Show stats for Typed mode
                statsContainer.style.display = 'block';
                completionSubtitle.style.display = 'block';

                // Populate Stats
                const totalTimeMs = Date.now() - sessionStartTime;
                const totalSeconds = Math.floor(totalTimeMs / 1000);
                const mins = Math.floor(totalSeconds / 60);
                const secs = totalSeconds % 60;
                document.getElementById('stat-time').innerText = mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;

                const totalQ = setSize * totalCycles;
                let accuracy = 100;
                if (totalQ > 0) {
                    accuracy = Math.max(0, Math.round(((totalQ - totalErrors) / totalQ) * 100));
                }
                document.getElementById('stat-accuracy').innerText = `${accuracy}%`;

                if (typedQuestionCount > 0) {
                    const avgMs = totalTypedTimeMs / typedQuestionCount;
                    const avgSecs = (avgMs / 1000).toFixed(1);
                    document.getElementById('stat-avg-speed').innerText = `${avgSecs}s`;
                } else {
                    document.getElementById('stat-avg-speed').innerText = `N/A`;
                }
                
                // Populate Review Section
                const reviewSection = document.getElementById('review-section');
                const reviewListItems = document.getElementById('review-list-items');
                
                if (reviewQueue.length > 0) {
                    reviewSection.style.display = 'block';
                    let listHtml = '';
                    reviewQueue.forEach(probStr => {
                        listHtml += `<li>${probStr}</li>`;
                    });
                    reviewListItems.innerHTML = listHtml;
                } else {
                    reviewSection.style.display = 'none';
                }
            }

            document.getElementById('practice-area').style.display = 'none';
            document.getElementById('complete-area').style.display = 'block';
        }

        function returnToMenu() {
            clearTimeout(timerId);
            clearTimeout(timerId2);
            document.getElementById('practice-area').style.display = 'none';
            document.getElementById('complete-area').style.display = 'none';
            document.getElementById('menu-area').style.display = 'block';
        }

        // Initialize display logic on load
        toggleInteraction();
    </script>
</body>
</html>
